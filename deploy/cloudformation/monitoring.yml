AWSTemplateFormatVersion: '2010-09-09'
Description: Worqi production monitoring and email alerts in Mumbai

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Enter a valid email address.

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: worqi-production-alerts
      DisplayName: Worqi production alerts
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - Key: Project
          Value: Worqi
        - Key: Environment
          Value: Production

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref AlertEmail
      Protocol: email
      TopicArn: !Ref AlertTopic

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Worqi-Production-EC2-HighCPU
      AlarmDescription: Worqi API EC2 CPU is at least 80 percent for 15 minutes.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: Worqi
        - Key: Environment
          Value: Production

  InstanceHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Worqi-Production-EC2-StatusCheckFailed
      AlarmDescription: Worqi API EC2 failed an AWS instance or system health check.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: Worqi
        - Key: Environment
          Value: Production

  ApiHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Worqi-Production-API-Unhealthy
      AlarmDescription: The Worqi public API health endpoint failed or stopped reporting.
      Namespace: Worqi/Production
      MetricName: APIHealth
      Dimensions:
        - Name: Service
          Value: API
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: Worqi
        - Key: Environment
          Value: Production

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic
